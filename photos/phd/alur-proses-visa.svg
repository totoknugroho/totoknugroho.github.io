<svg width="100%" viewBox="0 0 680 654" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'IBM Plex Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Alur proses pengajuan student visa Australia</title>
<desc>Enam tahap: LoA Unconditional, buat akun ImmiAccount, genuine statement dan dokumen, bayar dan submit aplikasi, medical check-up, lalu visa granted.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<line x1="340" y1="84" x2="340" y2="146" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="190" x2="340" y2="252" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="296" x2="340" y2="358" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="402" x2="340" y2="464" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="508" x2="340" y2="570" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow-green)"/>

<g>
  <rect x="180" y="40" width="320" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">LoA unconditional</text>
</g>
<g>
  <rect x="180" y="146" width="320" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="168" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Buat akun ImmiAccount</text>
</g>
<g>
  <rect x="180" y="252" width="320" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="274" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Genuine statement &amp; dokumen</text>
</g>
<g>
  <rect x="180" y="358" width="320" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="380" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Bayar &amp; submit aplikasi</text>
</g>
<g>
  <rect x="180" y="464" width="320" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="486" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Medical check-up (MCU)</text>
</g>
<g>
  <rect x="180" y="570" width="320" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="340" y="592" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">Visa granted</text>
</g>
</svg>
