<svg width="100%" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'IBM Plex Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Empat kategori dokumen pendukung untuk aplikasi student visa</title>
<desc>Identitas, riwayat pekerjaan, asuransi kesehatan, dan bukti genuine student, masing-masing dengan contoh dokumennya.</desc>

<g>
  <rect x="20" y="30" width="640" height="300" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="44" y="58" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Dokumen pendukung ImmiAccount</text>
</g>

<g>
  <rect x="50" y="90" width="280" height="100" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="70" y="118" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Identitas</text>
  <text x="70" y="142" dominant-baseline="central" font-size="12" fill="#185FA5">Paspor, KTP, akta lahir,</text>
  <text x="70" y="160" dominant-baseline="central" font-size="12" fill="#185FA5">SIM (jika ada)</text>
</g>

<g>
  <rect x="350" y="90" width="280" height="100" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="370" y="118" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Riwayat pekerjaan</text>
  <text x="370" y="142" dominant-baseline="central" font-size="12" fill="#993C1D">CV</text>
</g>

<g>
  <rect x="50" y="210" width="280" height="100" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="70" y="238" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Asuransi kesehatan</text>
  <text x="70" y="262" dominant-baseline="central" font-size="12" fill="#0F6E56">Surat verifikasi OSHC</text>
</g>

<g>
  <rect x="350" y="210" width="280" height="100" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="370" y="238" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Genuine student</text>
  <text x="370" y="262" dominant-baseline="central" font-size="12" fill="#534AB7">Genuine student</text>
  <text x="370" y="280" dominant-baseline="central" font-size="12" fill="#534AB7">statement</text>
</g>
</svg>
